<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="The Fine Arc — Original fine art, crafted with intention. Explore and collect contemporary works by a singular artist." />
    <title>The Fine Arc — Original Fine Art</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Inter:wght@300;400;500&display=block" rel="stylesheet" />
    <script>
      window.onerror = function(msg, src, line, col, err) {
        document.getElementById('root').innerHTML =
          '<div style="padding:30px;font-family:monospace;background:#fff;color:#c00;max-width:800px;margin:40px auto">' +
          '<h2 style="font-size:18px;margin:0 0 12px">JavaScript Error</h2>' +
          '<p style="margin:0 0 8px">' + msg + '</p>' +
          '<p style="margin:0;color:#888">' + src + ' line ' + line + '</p>' +
          '</div>';
      };
      window.addEventListener('unhandledrejection', function(e) {
        document.getElementById('root').innerHTML =
          '<div style="padding:30px;font-family:monospace;background:#fff;color:#c00;max-width:800px;margin:40px auto">' +
          '<h2 style="font-size:18px;margin:0 0 12px">Unhandled Promise Rejection</h2>' +
          '<p style="margin:0">' + (e.reason && e.reason.message ? e.reason.message : e.reason) + '</p>' +
          '</div>';
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
